# dsh-workflow-groups bundle patch: inserts its plugin row into the web plugin roster.
# The row mounts BOTH halves: the host side (workflow/* event registry, the
# workflow_new / workflow_groups model tools, and the wf:list / wf:clear /
# wf:debug RPC handlers) and the browser side (the modules node half scans
# dsh.client packages into the web plugin roster, served from this package's
# lib/client.js — the「工作流」conversation view tab rendering grouped panels).
#
# Install into a dsh profile:
#   dsh plugin --profile web add link:D:/Deepseek Harness/plugins/dsh-workflow-groups
#   dsh plugin --profile web add https://github.com/CriscolTheCoder/dsh-workflow-groups
- insert:
    - id: workflow-groups
      name: 'dsh-workflow-groups'
